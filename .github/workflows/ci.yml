name: CI

on:
  push:
    branches: [main, test, develop]
  pull_request:
    branches: [main, test]

env:
  NODE_VERSION: "24"

jobs:
  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: ./backend/package-lock.json
      - run: npm ci
      - name: TypeScript compile check
        run: npx tsc --noEmit

  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: railflow
          POSTGRES_PASSWORD: railflow_test
          POSTGRES_DB: railflow_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready -U railflow
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: ./backend/package-lock.json
      - run: npm ci
      - name: Run tests
        run: npx jest --ci --coverage --forceExit
        env:
          PGHOST: localhost
          PGPORT: 5432
          PGUSER: railflow
          PGPASSWORD: railflow_test
          PGDATABASE: railflow_test
          REDIS_URL: redis://localhost:6379
          NODE_ENV: test
          JWT_SECRET: test_secret
          JWT_REFRESH_SECRET: test_refresh_secret

  build:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: [lint, test]
    defaults:
      run:
        working-directory: ./backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: npm ci
      - run: npx tsc
      - name: Build Docker image
        run: docker build -t railflow-api:latest .
