version: "3.9"

x-app-base: &app-base
  build:
    context: ./backend
    dockerfile: Dockerfile
    target: runner
  environment: &app-env
    NODE_ENV: production
    PORT: 5000
    CLUSTER_ENABLED: "true"
    PGHOST: postgres
    PGPORT: 5432
    PGUSER: railflow
    PGPASSWORD: ${PGPASSWORD:-railflow_prod}
    PGDATABASE: railflow
    REDIS_URL: redis://redis:6379
    ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-https://railflow.example.com}
    SMTP_HOST: ${SMTP_HOST:-mailhog}
    SMTP_PORT: "1025"
    SMTP_USER: ${SMTP_USER:-}
    SMTP_PASS: ${SMTP_PASS:-}
    JWT_SECRET: ${JWT_SECRET:-change_me_in_production}
    JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-change_me_too}
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_started
  restart: unless-stopped
  deploy:
    resources:
      limits:
        cpus: "1"
        memory: 512M

services:
  app:
    <<: *app-base
    ports:
      - "5000:5000"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5000/health"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

  app-worker:
    <<: *app-base
    command: ["node", "dist/worker.js"]
    ports: []
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: railflow
      POSTGRES_PASSWORD: ${PGPASSWORD:-railflow_prod}
      POSTGRES_DB: railflow
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U railflow"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512M

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

  mailhog:
    image: mailhog/mailhog
    ports:
      - "1025:1025"
      - "8025:8025"
    profiles:
      - dev

volumes:
  pgdata:
  redisdata:
