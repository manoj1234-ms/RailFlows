receivers:
  - otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318

processors:
  batch:
    timeout: 5s
    send_batch_size: 1024

  memory_limiter:
    check_interval: 1s
    limit_mib: 512
    spike_limit_mib: 128

  resource:
    attributes:
      - key: service.environment
        value: "local"
        action: upsert
      - key: project
        value: "railflow"
        action: upsert

exporters:
  # Export metrics to Prometheus (pull model via /metrics endpoint)
  prometheus:
    endpoint: "0.0.0.0:8889"
    namespace: "railflow"

  # Export traces to stdout (replace with Jaeger/Tempo in production)
  debug:
    verbosity: basic

  # Jaeger exporter (uncomment when Jaeger is added)
  # otlp/jaeger:
  #   endpoint: jaeger:4317
  #   tls:
  #     insecure: true

  # Logging exporter
  logging:
    loglevel: warn

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch, resource]
      exporters: [debug]

    metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch, resource]
      exporters: [prometheus]

    logs:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [logging]

  telemetry:
    logs:
      level: warn
    metrics:
      address: 0.0.0.0:8888
